<style>
:root{--bg:#0b1220;--card:#111a2b;--ink:#eef6ff;--muted:#9aa8bd;--line:#26344d;--deep:#08111f;--teal:#14b8a6;--teal2:#2dd4bf;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--soft:#162238;--shadow:0 26px 54px rgba(0,0,0,.42),0 10px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#0b1220 0%,#101827 100%);color:var(--ink)}
body{padding-bottom:18px}
button{font-family:inherit;cursor:pointer;border:0}
.top{position:sticky;top:0;z-index:50;background:#0b1220;color:#fff;padding:14px 12px 12px;box-shadow:0 12px 30px rgba(0,0,0,.30);border-bottom:1px solid #26344d}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:39px;height:39px;border-radius:14px;background:#17b8aa;color:#08111f;display:grid;place-items:center;font-weight:1000;font-size:17px;box-shadow:0 8px 20px rgba(23,184,170,.22)}
.title{font-size:18px;font-weight:1000;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:11px;color:#9aa8bd;margin-top:3px;white-space:nowrap}
.refresh{background:#152238;color:#eef6ff;border:1px solid #30415e;border-radius:13px;padding:9px 11px;font-size:13px;font-weight:900}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:0}
.metric{background:#121d31;border:1px solid #2a3955;border-radius:15px;padding:9px 8px;text-align:center;color:#eef6ff;transition:.18s}
.metric b{display:block;font-size:20px;line-height:1;font-weight:1000}
.metric span{display:block;font-size:12px;color:#9aa8bd;margin-top:4px}
.metric.active{background:#17b8aa;color:#07101d;border-color:#23d3c4;box-shadow:0 10px 22px rgba(23,184,170,.18)}
.metric.active span{color:#073733}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tab{background:#121d31;color:#cbd5e1;border:1px solid #2a3955;border-radius:15px;padding:10px 8px;font-size:14px;font-weight:1000}
.tab.active{background:#17b8aa;color:#07101d;border-color:#23d3c4;box-shadow:0 10px 22px rgba(23,184,170,.18)}
.tab .num{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:999px;margin-right:6px;background:#26344d;color:#dbeafe;font-size:12px;padding:0 7px}
.tab.active .num{background:#07101d;color:#2dd4bf}
.wrap{padding:14px 10px 0}
.list{display:flex;flex-direction:column;gap:16px}
.card{background:#111a2b;border:1px solid rgba(45,212,191,.86);border-radius:25px;box-shadow:0 30px 60px rgba(0,0,0,.44),0 12px 26px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden;position:relative;outline:1px solid rgba(255,255,255,.05);margin-bottom:3px}
.card:before{content:"";position:absolute;top:0;right:12px;left:12px;height:6px;border-radius:0 0 999px 999px;background:linear-gradient(90deg,#14b8a6,#2dd4bf);box-shadow:0 8px 18px rgba(45,212,191,.22)}
.card-inner{padding:11px 12px 9px}
.row-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.order-head{display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap}
.code{display:inline-flex;align-items:center;border-radius:999px;background:#162238;color:#dffcff;border:1px solid #2dd4bf;font-size:19px;font-weight:1000;padding:7px 12px;line-height:1;letter-spacing:.2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.branch-code{display:inline-flex;align-items:center;border-radius:999px;background:#f59e0b;color:#111827;border:1px solid #fbbf24;font-size:13px;font-weight:1000;padding:7px 10px;line-height:1;white-space:nowrap}
.badge{display:inline-flex;align-items:center;border-radius:999px;font-size:12px;font-weight:1000;padding:6px 10px;line-height:1;border:1px solid transparent;white-space:nowrap}
.b-new{background:#102845;color:#93c5fd;border-color:#1d4ed8}
.b-done{background:#10291e;color:#86efac;border-color:#16a34a}
.info{border:1px solid #2f4261;border-radius:19px;background:#0e1728;overflow:hidden;margin:3px 0 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 18px rgba(0,0,0,.13)}
.info-row{display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:center;min-height:39px;padding:8px 10px;border-top:1px solid #293951}
.info-row:first-child{border-top:0}
.label{font-size:12px;color:#9aa8bd;font-weight:900;line-height:1;text-align:right;white-space:nowrap}
.value{font-size:13px;font-weight:950;color:#eef6ff;line-height:1.35;text-align:right;word-break:normal;overflow-wrap:anywhere}

.amount-pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start;direction:rtl}
.amount-pill{display:inline-flex;align-items:center;border-radius:999px;background:#162238;border:1px solid #2f4261;color:#eef6ff;font-weight:1000;font-size:12px;padding:6px 9px;line-height:1;white-space:nowrap}
.amount-pill.main{background:#112f2d;border-color:#14b8a6;color:#5eead4}
.amount-pill.gbp{background:#2a1f10;border-color:#f59e0b;color:#fbbf24}
.amount-pill.usd{background:#102845;border-color:#1d4ed8;color:#93c5fd}
.amount-pill.eur{background:#26153d;border-color:#7c3aed;color:#c4b5fd}

.items{border:1px solid #2f4261;border-radius:19px;background:#0e1728;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 18px rgba(0,0,0,.13)}
.items-title{display:flex;justify-content:space-between;align-items:center;background:#162238;border-bottom:1px solid #293951;padding:9px 11px;font-size:13px;font-weight:1000;color:#eef6ff}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 11px;border-top:1px solid #22324b}
.item:first-of-type{border-top:0}
.item-name{font-size:14px;font-weight:950;line-height:1.35;color:#eef6ff;text-align:right;word-break:normal;overflow-wrap:anywhere}
.qty{min-width:78px;text-align:center;border-radius:15px;background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#111827;font-weight:1000;padding:8px 11px;font-size:15px;box-shadow:0 8px 18px rgba(245,158,11,.22)}
.empty-items{padding:12px;color:#9aa8bd;font-size:13px;font-weight:900;text-align:center}
.show-items{width:100%;height:42px;border-radius:15px;background:#162238;color:#2dd4bf;border:1px solid #2f4261;font-weight:1000;font-size:13px;margin:10px 0 0}
.actions{display:grid;grid-template-columns:1fr;gap:7px;padding:0 12px 13px}
.action{height:42px;border-radius:17px;font-size:13px;font-weight:1000;color:#fff;box-shadow:0 12px 24px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.18)}
.action.prepare{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#111827}
.action.back{background:linear-gradient(135deg,#475569,#64748b)}
.empty{margin:28px auto 0;max-width:310px;text-align:center;background:#111a2b;border:1px solid #24344f;border-radius:24px;padding:22px 12px;color:#9aa8bd;font-weight:900;box-shadow:var(--shadow)}
.empty-icon{width:44px;height:44px;border-radius:16px;background:#112f2d;color:#5eead4;display:grid;place-items:center;margin:0 auto 10px;font-size:21px}
.toast{position:fixed;right:14px;left:14px;bottom:14px;z-index:100;background:#07101d;color:#fff;text-align:center;padding:12px;border-radius:15px;font-weight:950;box-shadow:0 16px 34px rgba(0,0,0,.35);opacity:0;transform:translateY(16px);pointer-events:none;transition:.22s}
.toast.show{opacity:1;transform:translateY(0)}
body.loading .refresh{opacity:.65}
@media(min-width:760px){.top{max-width:760px;margin:0 auto;border-radius:0 0 22px 22px}.wrap{max-width:760px;margin:0 auto}.list{display:flex;flex-direction:column;gap:16px}}.wrap{max-width:760px;margin:0 auto}.list{display:grid;grid-template-columns:1fr 1fr;gap:16px}}.wrap{max-width:760px;margin:0 auto}.list{display:grid;grid-template-columns:1fr 1fr;gap:13px}}

.items-panel{width:100%;max-width:520px;max-height:82vh;background:#111a2b;border:1px solid rgba(45,212,191,.9);border-radius:24px;box-shadow:0 30px 70px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column}
.items-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;background:#162238;border-bottom:1px solid #293951}

.items-panel-body{padding:10px;overflow:auto}

.modal-item-name{font-size:15px;font-weight:950;line-height:1.35;color:#eef6ff;text-align:right}
.modal-qty{min-width:76px;text-align:center;border-radius:15px;background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#111827;font-weight:1000;padding:8px 10px;font-size:15px}

</style>

let USD_RATE=50, EUR_RATE=60, GBP_RATE=70;
async function loadSharedCurrencyRates(){
  try{
    const r=await fetch(SB_URL+"/rest/v1/settings?select=key,value",{headers:SB_HEADERS});
    if(!r.ok)return;
    const rows=await r.json();
    const map={};
    (rows||[]).forEach(x=>map[String(x.key||"")]=String(x.value||""));
    const usd=Number(map.rate_usd), eur=Number(map.rate_eur), gbp=Number(map.rate_gbp);
    if(Number.isFinite(usd)&&usd>0)USD_RATE=usd;
    if(Number.isFinite(eur)&&eur>0)EUR_RATE=eur;
    if(Number.isFinite(gbp)&&gbp>0)GBP_RATE=gbp;
    if(typeof loadOrders==="function")loadOrders();
  }catch(e){}
}

function init(){loadPharmacyPreparers();loadSharedCurrencyRates();loadOrders();refreshTimer=setInterval(loadOrders,10000);setInterval(loadSharedCurrencyRates,300000);setInterval(checkDateRollover,30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadOrders()});window.addEventListener("focus",loadOrders)}
function checkDateRollover(){const k=dayKey(new Date());if(k!==currentDateKey){currentDateKey=k;activeDay="today";activeStatus="new";loadOrders()}}
function dayKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

async function loadPharmacyPreparers(){
  try{
    const r=await fetch(SB_URL+"/rest/v1/pharmacy_preparers?select=name,is_active,sort_order&is_active=eq.true&order=sort_order.asc,name.asc",{headers:SB_HEADERS});
    if(!r.ok)throw new Error("load preparers failed");
    const rows=await r.json();
    const names=(rows||[]).map(x=>clean(x.name)).filter(Boolean);
    if(names.length)PHARMACY_PREPARERS=names;
  }catch(e){}
}
async function loadOrders(){
  try{
    document.body.classList.add("loading");
    const url=SB_URL+"/rest/v1/orders?select=*&order=created_at.desc&limit=500&or=(source.neq.essentials,source.is.null)";
    const r=await fetch(url,{headers:SB_HEADERS});
    const d=await r.json();
    if(!r.ok)throw new Error(d&&d.message?d.message:"load failed");
    orders=dedupeOrders(filterCancelledGroups(Array.isArray(d)?d:[]));
    document.getElementById("lastSync").textContent="آخر تحديث: "+arNum(new Date().toLocaleTimeString("ar-EG",{hour:"numeric",minute:"2-digit"}));
    render();
  }catch(e){
    document.getElementById("lastSync").textContent="فشل التحديث";
    document.getElementById("ordersList").innerHTML="";
    const empty=document.getElementById("ordersEmpty");
    empty.style.display="block";
    empty.innerHTML='<div class="empty-icon">!</div><div>تعذر تحميل الطلبات. اضغط تحديث.</div>';
    toast("حصل خطأ في تحميل الطلبات");
  }finally{
    document.body.classList.remove("loading");
  }
}
function manualRefresh(){loadOrders();toast("تم التحديث")}
function setDay(day){activeDay=day;document.getElementById("todayTab").classList.toggle("active",day==="today");document.getElementById("tomorrowTab").classList.toggle("active",day==="tomorrow");render()}
function setStatusFilter(status){activeStatus=activeStatus===status?status:status;render()}
function setPharmacySearch(v){pharmacySearch=String(v||"").trim();render()}

function render(){
  const visibleOrders=orders.filter(showInPharmacy);
  const today=visibleOrders.filter(o=>effectiveDay(o)==="today");
  const tomorrow=visibleOrders.filter(o=>effectiveDay(o)==="tomorrow");
  document.getElementById("todayCount").textContent=arNum(today.length);
  document.getElementById("tomorrowCount").textContent=arNum(tomorrow.length);
  let current=(activeDay==="today"?today:tomorrow).sort(sortOrders);
  document.getElementById("newCount").textContent=arNum(current.filter(o=>pharmacyStatus(o)==="new").length);
  document.getElementById("preparingCount").textContent=arNum(current.filter(o=>pharmacyStatus(o)==="preparing").length);
  document.getElementById("preparedCount").textContent=arNum(current.filter(o=>pharmacyStatus(o)==="prepared").length);
  document.getElementById("filterNew").classList.toggle("active",activeStatus==="new");
  document.getElementById("filterPreparing").classList.toggle("active",activeStatus==="preparing");
  document.getElementById("filterPrepared").classList.toggle("active",activeStatus==="prepared");
  current=current.filter(o=>pharmacyStatus(o)===activeStatus).filter(pharmacySearchPass);
  shownOrders=current;
  const list=document.getElementById("ordersList");
  const empty=document.getElementById("ordersEmpty");
  if(!current.length){
    list.innerHTML="";
    empty.style.display="block";
    empty.innerHTML='<div class="empty-icon">✓</div><div>'+ (pharmacySearch ? 'مفيش طلبات مطابقة للبحث' : 'مفيش طلبات في القسم ده') +'</div>';
    return;
  }
  empty.style.display="none";
  list.innerHTML=current.map(card).join("");
}

function card(o){
  const st=pharmacyStatus(o);
  const items=getItems(o);
  const hotel=hotelArName(o.hotel);
  const room=clean(o.room);
  const dateText=formatDateAr(effectiveDate(o));
  const ready=readyBefore(o);
  const code=branchCode(o.branch);
  return `<article class="card">
    <div class="card-inner">
      <div class="row-top">
        <div class="order-head">
          <div class="code">طلب #${esc(arNum(o.id))}</div>
          ${code?`<div class="branch-code">كود ${esc(arNum(code))}</div>`:""}
        </div>
        <div class="badge ${st==="prepared"?"b-done":st==="preparing"?"b-preparing":"b-new"}">${st==="prepared"?"اتحضر":st==="preparing"?"جاري التحضير":"جديد"}</div>
      </div>
      <div class="info">
        <div class="info-row"><div class="label">الفندق</div><div class="value">${esc(hotel)}</div></div>
        <div class="info-row"><div class="label">التاريخ</div><div class="value">${esc(dateText)}</div></div>
        <div class="info-row"><div class="label">جاهز قبل</div><div class="value">${esc(ready||"غير محدد")}</div></div>
        ${(st==="preparing"||st==="prepared")?`<div class="info-row"><div class="label">${st==="prepared"?"حضّره":"بيحضره"}</div><div class="value"><span style="color:#fbbf24">${esc(preparerName(o)||"غير محدد")}</span></div></div>`:""}
        <div class="info-row"><div class="label">ميعاد الوصول</div><div class="value">${esc(ar12(o.delivery_time)||"غير محدد")}</div></div>
        <div class="info-row"><div class="label">الدفع</div><div class="value">${esc(paymentAr(o.payment))}</div></div>
        <div class="info-row"><div class="label">الدليفري</div><div class="value">${deliveryFeeHtml(o)}</div></div>
        <div class="info-row"><div class="label">الإجمالي</div><div class="value">${amountHtml(o)}</div></div>
        <div class="info-row"><div class="label">رقم الغرفة</div><div class="value">${esc(room?arNum(room):"غير محدد")}</div></div>
      </div>
      <div class="items">
        <div class="items-title"><span>الأصناف</span><span>${arNum(items.length)} صنف</span></div>
        ${itemsBlock(o,items)}
      </div>
    </div>
    <div class="actions">${pharmacyActionButton(o,st)}</div>
  </article>`;
}

function itemsBlock(o,items){
  if(!items.length)return '<div class="empty-items">لا توجد أصناف واضحة</div>';
  return `<button class="show-items" onclick="showItemsModal('${esc(String(o.id))}')">عرض قائمة الأصناف</button>`;
}

function preparerName(o){return clean(o.pharmacy_preparing_by||o.pharmacy_prepared_by||o.prepared_by||"")}
function pharmacyActionButton(o,st){
  const ids=esc(idsText(o));
  if(st==="prepared")return `<button class="action back" onclick="setPrepared('${ids}',false)">رجوع لجديد</button>`;
  if(st==="preparing")return `<button class="action finish" onclick="setPrepared('${ids}',true)">تم التحضير</button>`;
  return `<button class="action prepare-start" onclick="showPreparerModal('${ids}')">جاري التحضير</button>`;
}
function showPreparerModal(ids){
  document.getElementById("preparerModalTitle").textContent="اختار اللي هيحضّر الأوردر";
  document.getElementById("preparerModalBody").innerHTML=`<div class="preparer-grid">${PHARMACY_PREPARERS.map(n=>`<button class="preparer-btn" onclick="setPreparing('${esc(ids)}','${esc(n)}')">${esc(n)}</button>`).join("")}</div>`;
  document.getElementById("preparerModal").classList.add("show");
  lockPageScroll();
}
function hidePreparerModal(){
  document.getElementById("preparerModal").classList.remove("show");
  if(!document.getElementById("itemsModal").classList.contains("show"))unlockPageScroll();
}
function closePreparerModal(e){if(e.target&&e.target.id==="preparerModal")hidePreparerModal()}
async function setPreparing(ids,name){
  try{
    const list=String(ids||"").split(",").map(x=>x.trim()).filter(Boolean);
    if(!list.length)return toast("تعذر تحديد الطلب");
    const now=new Date().toISOString();
    const payload={pharmacy_status:"preparing",pharmacy_preparing_by:name,pharmacy_preparing_at:now};
    const check=await fetch(SB_URL+"/rest/v1/orders?id=in.("+list.map(encodeURIComponent).join(",")+")&select=id,pharmacy_status,pharmacy_preparing_by",{headers:SB_HEADERS});
    if(check.ok){
      const rows=await check.json();
      const taken=(rows||[]).find(r=>{
        const s=String(r.pharmacy_status||"").toLowerCase();
        return (s==="preparing"||s==="done"||s==="prepared") && clean(r.pharmacy_preparing_by||"") && clean(r.pharmacy_preparing_by)!==name;
      });
      if(taken){toast("الأوردر ده ماسكه بالفعل: "+clean(taken.pharmacy_preparing_by)); hidePreparerModal(); await loadOrders(); return;}
    }
    const results=await Promise.all(list.map(id=>fetch(SB_URL+"/rest/v1/orders?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:SB_HEADERS,body:JSON.stringify(payload)})));
    if(results.some(r=>!r.ok))throw new Error("patch failed");
    orders.forEach(o=>{if((o._ids||[String(o.id)]).some(id=>list.includes(String(id)))){o.pharmacy_status="preparing";o.pharmacy_preparing_by=name;o.pharmacy_preparing_at=now}});
    hidePreparerModal();
    activeStatus="preparing";
    render();
    toast("تم تعيين التحضير: "+name);
  }catch(e){console.error(e);toast("تعذر تعيين التحضير. شغّل SQL لو أول مرة")}
}

let modalScrollY=0;
function lockPageScroll(){
  modalScrollY=window.scrollY||document.documentElement.scrollTop||0;
  document.documentElement.classList.add("modal-open");
  document.body.classList.add("modal-open");
  document.body.style.position="fixed";
  document.body.style.top="-"+modalScrollY+"px";
  document.body.style.left="0";
  document.body.style.right="0";
  document.body.style.width="100%";
}
function unlockPageScroll(){
  document.documentElement.classList.remove("modal-open");
  document.body.classList.remove("modal-open");
  document.body.style.position="";
  document.body.style.top="";
  document.body.style.left="";
  document.body.style.right="";
  document.body.style.width="";
  window.scrollTo(0,modalScrollY||0);
}
function showItemsModal(id){
  const sid=String(id);
  const all=[...shownOrders,...orders];
  const o=all.find(x=>String(x.id)===sid||(x._ids||[]).map(String).includes(sid));
  if(!o){toast("تعذر فتح قائمة الأصناف");return}

async function savePushToken(token){
  const q = SB_URL + "/rest/v1/push_tokens?select=id&token=eq." + encodeURIComponent(token) + "&role=eq." + encodeURIComponent(PUSH_ROLE) + "&limit=1";
  const check = await fetch(q, {headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}});
  if(check.ok){
    const rows = await check.json();
    if(Array.isArray(rows) && rows.length) return true;
  }
  const saveRes = await fetch(SB_URL+"/rest/v1/push_tokens", {
    method:"POST",
    headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
    body:JSON.stringify({ token: token, role: PUSH_ROLE })
  });
  return saveRes.ok || saveRes.status === 409;
}
async function setupPush(){
  try{
    if(!("Notification" in window) || !("serviceWorker" in navigator) || typeof firebase==="undefined" || !firebase.messaging) return;
    if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const messaging = firebase.messaging();
    const perm = await Notification.requestPermission();
    if(perm !== "granted") return;
    const reg = await navigator.serviceWorker.ready;
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if(!token) return;
    await savePushToken(token);
    localStorage.setItem("selfcare_push_token_" + PUSH_ROLE, token);
    if(!window.__selfcareOnMessageReady && messaging.onMessage){
      window.__selfcareOnMessageReady = true;
      messaging.onMessage((payload)=>{
        try{
          const n = (payload && payload.notification) || {};
          const d = (payload && payload.data) || {};
          const key = pushKeyFromPayload(payload);
          if(pushRecentlyShown(key)) return;
          reg.showNotification(n.title || d.title || "🔔 طلب جديد", {
            body: n.body || d.body || "وصل طلب جديد",
            icon: "icon-192.png",
            badge: "icon-192.png",
            vibrate: [200,100,200],
            tag: "selfcare-order-" + key,
            renotify: false,
            data: { url: "./", key }
          });
        }catch(_){}
      });
    }
  }catch(e){}
}
window.addEventListener("load", ()=>{ setTimeout(setupPush, 1200); });
</script>
